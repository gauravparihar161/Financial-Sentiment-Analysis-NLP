[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-sentiment"
version = "0.1.0"
description = "Leakage-safe financial-news sentiment backtesting pipeline"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "scipy>=1.13,<2",
  "transformers>=4.46,<5",
  "uvicorn[standard]>=0.30,<1",
  "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
financial-sentiment = "financial_sentiment.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

